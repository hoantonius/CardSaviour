org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 compiles Kotlin itself. Keep this on so the project does not also apply kotlin-android.
android.builtInKotlin=true
# KSP still registers generated sources through the Kotlin source set DSL.
android.disallowKotlinSourceSets=false
